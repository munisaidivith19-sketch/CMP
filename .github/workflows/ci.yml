name: CI

# On every pull request (and pushes to main): dependency audit, the server
# test suite against a throw-away MongoDB, the web build, and the bundle
# secret scan. No secrets are needed — the tests generate their own.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Audit server dependencies
        run: npm audit --audit-level=high --omit=dev
        working-directory: server
      - name: Audit client dependencies
        run: npm audit --audit-level=high --omit=dev
        working-directory: client

  test:
    name: Server tests + client build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/cmp_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      # Error-handling catalogue: schema, unique IDs, test references and source
      # signatures must still match the repository (no database or network needed).
      - name: Validate the error catalogue
        run: python3 error_handling/diagnostics/validate_catalog.py --no-pdf-check
      - name: Error-handling unit tests (no database)
        run: node --test error_handling/tests/backend/error_handler.test.mjs error_handling/tests/web/client_error_handling.test.mjs
      - name: Scan the built bundle for secrets
        run: node scripts/verify-bundle.mjs client/dist
