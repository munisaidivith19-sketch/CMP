name: Keep Render Alive

# Render's free plan puts the service to sleep after 15 minutes with no traffic.
#
# How the app stays awake 05:30–22:00 IST and sleeps 22:00–05:30 IST:
#   1. This workflow WAKES the server each morning at ~05:30 IST (a sleeping
#      server cannot wake itself).
#   2. Once awake, the server pings ITSELF every 14 minutes, but only between
#      05:30 and 22:00 IST (server/src/utils/keepAlive.js). After 22:00 it stops,
#      so Render puts it to sleep for the night and no instance hours are used.
#
# Why not ping every 14 min from here? This repository is private: GitHub bills
# every run as at least 1 minute, and ~71 runs/day (~2,200 min/month) would use
# up the free 2,000 Actions minutes before the month ends. Two wake-up runs a
# day cost ~62 minutes a month. Render: ~16.5 h/day ≈ 510 h/month (free: 750 h).
#
# GitHub cron is in UTC (IST = UTC+5:30): 00:02 UTC = 05:32 IST, 00:17 UTC =
# 05:47 IST. The second run is a backup — scheduled runs can be late or dropped.

on:
  schedule:
    - cron: '2 0 * * *'
    - cron: '17 0 * * *'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake the server (allowed window 05:30–22:00 IST only)
        env:
          # Optional override: Settings → Secrets and variables → Actions → Variables → PING_URL
          PING_URL: ${{ vars.PING_URL || 'https://jnn.onrender.com/api/health' }}
        run: |
          # Current time in IST as minutes since midnight
          H=$(TZ=Asia/Kolkata date +%H); M=$(TZ=Asia/Kolkata date +%M)
          NOW=$((10#$H * 60 + 10#$M))
          START=$((5 * 60 + 30))   # 05:30 IST
          END=$((22 * 60))         # 22:00 IST

          if [ "$NOW" -lt "$START" ] || [ "$NOW" -ge "$END" ]; then
            echo "IST $H:$M is outside 05:30–22:00 — not waking the server"
            exit 0
          fi

          echo "IST $H:$M — waking $PING_URL"
          # A sleeping free instance can take up to ~60 s to start, so allow retries.
          curl -fsS --retry 4 --retry-delay 15 --retry-all-errors \
            --max-time 90 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            "$PING_URL"
