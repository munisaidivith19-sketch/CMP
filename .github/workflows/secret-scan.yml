name: Secret scan

# gitleaks over the full git history on every pull request and push to main.
# A leaked credential fails the run; rotate it first, then purge it from
# history (git filter-repo) — deleting the file in a new commit is not enough.
#
# Personal-account repositories need nothing else. If this repository moves to
# a GitHub *organization*, gitleaks-action needs a (free) GITLEAKS_LICENSE repo
# secret: https://gitleaks.io

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
