org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Address of the JNN backend (no trailing slash) — the deployed web portal.
# Same meaning as EXPO_PUBLIC_API_URL in the Expo app. Override per build with
#   ./gradlew assembleDebug -Pvexon.apiUrl=http://10.0.2.2:5000   (local server from the emulator)
# or the VEXON_API_URL environment variable. Users can also change it on the login screen.
vexon.apiUrl=https://jnn.onrender.com

# EAS project id (Expo push tokens). Needed only for push notifications, together
# with app/google-services.json. Same value as EAS_PROJECT_ID in mobile/.env.
vexon.easProjectId=
