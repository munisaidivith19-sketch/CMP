services:
  - type: web
    name: jnn-api
    runtime: node
    plan: free
    rootDir: server
    # Build the backend AND the frontend. The client's Vite build needs its
    # devDependencies, but Render sets NODE_ENV=production (which makes plain
    # `npm install` skip devDeps), so the client install forces them in.
    # Express then serves the built client/dist itself (see server/src/app.js),
    # so the whole app runs from this one service — same origin, no CORS setup.
    buildCommand: npm install && cd ../client && npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      # Render sits in front of the app as a single reverse-proxy hop — this
      # makes rate limiting see the real visitor IP instead of Render's.
      - key: TRUST_PROXY
        value: "1"
      # Paste your MongoDB Atlas connection string in Render's dashboard when it
      # asks (never here — this file is pushed to GitHub, so secrets don't belong in it).
      - key: MONGO_URI
        sync: false
      # This service's own public URL. The frontend is served from here, so this
      # must match the real Render URL for Socket.IO's origin check to accept the
      # browser's realtime connection. If the service name "jnn-api" is taken,
      # Render adds a suffix — then update both of these to the actual URL and
      # redeploy. (comma-separate if you ever add more origins.)
      - key: CLIENT_URL
        value: https://jnn.onrender.com
      - key: APP_URL
        value: https://jnn.onrender.com
      # Parent OTP SMS is ON: OTPs are sent through the college SMS gateway
      # (OTP_PROVIDER=college_sms + the SMS_* secrets set in the dashboard).
      # Set it to "false" to stop sending; OTPs are then still generated and
      # verified, and shown to ADMINS only in Security & Logs → OTP.
      - key: OTP_SMS_ENABLED
        value: "true"
      # College SMS gateway credentials — required while OTP_SMS_ENABLED is
      # "true", or "Send OTP" fails with "not configured yet". Set the values
      # in the Render dashboard (never in this file). SMS_API_URL is optional
      # and must be https:// in production.
      - key: SMS_API_KEY
        sync: false
      - key: SMS_SENDER_ID
        sync: false
      - key: SMS_OTP_TEMPLATE_ID
        sync: false
      - key: SMS_EXIT_TEMPLATE_ID
        sync: false
      - key: SMS_API_URL
        sync: false
      # Legacy admin-only /dev/otp page (superseded by Security & Logs → OTP).
      # It is always 404 in production, whatever this says.
      - key: DEV_OTP_PORTAL
        value: "false"
      # Auto-generated securely by Render — you never see or set these yourself.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CHAT_ENCRYPTION_KEY
        generateValue: true
      # Optional: set these (from cloudinary.com, free tier) so uploaded photos
      # survive restarts — Render's own disk is wiped on every deploy/restart.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Optional: the Groq key for the AI Study Assistant. Leave unset and the
      # rest of the app works; only the assistant is disabled.
      - key: GROQ_API_KEY
        sync: false
