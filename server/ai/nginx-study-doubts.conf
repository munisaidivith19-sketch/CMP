# nginx location for the self-hosted Study Doubts assistant.
#
# Paste this INSIDE your existing `server { ... }` block (the HTTPS one for
# tech.jnn.edu.in), ABOVE the general `location / { ... }` block. It only
# affects /api/ai/study-doubts/; every other route (including the existing
# Groq Study Assistant) keeps its current settings.
#
# Then:  sudo nginx -t && sudo systemctl reload nginx
#
# Never add a location that proxies to 127.0.0.1:11434 (Ollama). The model
# must only be reachable by the Node backend on the same machine.

location /api/ai/study-doubts/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Streamed answers (Server-Sent Events): send each piece as soon as it's ready.
    proxy_buffering off;
    proxy_cache off;
    gzip off;

    # A CPU model can take a while: queue wait + loading + a long answer.
    # Must be at least LOCAL_AI_TIMEOUT_MS (default 180 s).
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Questions are small; reject anything bigger.
    client_max_body_size 16k;
}
